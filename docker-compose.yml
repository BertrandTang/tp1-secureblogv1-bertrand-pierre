version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secureblog_backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - SESSION_SECRET=secureblog_session_secret_key_tp1_2026
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secureblog_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
